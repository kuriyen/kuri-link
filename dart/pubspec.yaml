name: kuri_link
description: Private RPC between a front end and its back end, in this process or on another device.
version: 0.3.2
repository: https://github.com/kuriyen/kuri-link
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  # Must match the flutter_rust_bridge crate's version exactly.
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.0
  cbor: ^6.5.0
  freezed: ^3.0.0
  lints: ^6.0.0
  test: ^1.25.0
