[workspace]
resolver = "2"
members = [
    "crates/kuri-link",
    "crates/kuri-link-ffi",
    "crates/kuri-link-gateway",
    "examples/echo",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["bayanasar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuriyen/kuri-link"
# Nothing is published until the wire format survives a real-device spike.
publish = false

[workspace.dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
ciborium = "0.2"
data-encoding = "2"
# The Dart package pins the same version; the two must match exactly.
flutter_rust_bridge = "=2.13.0"
getrandom = "0.4"
# The versions iroh's own port mapping uses, so nothing new is built.
igd-next = { version = "0.17", features = ["aio_tokio"] }
netwatch = "0.19"
iroh-mdns-address-lookup = "0.6"
# For tests: a relay on loopback, the one iroh itself uses.
iroh-relay = { version = "1.3", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tracing = "0.1"
