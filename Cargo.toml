[workspace]
resolver = "2"
members = ["crates/kuri-link", "crates/kuri-link-ffi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
authors = ["bayanasar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuriyen/kuri-link"
# Nothing is published until the wire format survives a real-device spike.
publish = false

[workspace.dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tracing = "0.1"
